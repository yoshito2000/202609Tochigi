<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>栃木ゴルフ　　 9/19〜9/21</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px 12px 40px;
    background: #f4f6f8;
    color: #222;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        Meiryo,
        sans-serif;
}

.container {
    max-width: 900px;
    margin: 0 auto;
}

h1 {
    text-align: center;
    font-size: 24px;
    margin: 10px 0 5px;
}

.subtitle {
    text-align: center;
    color: #666;
    font-size: 14px;
    margin-bottom: 20px;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.day-title {
    font-size: 19px;
    font-weight: bold;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 2px solid #ddd;
}

.course-name {
    font-size: 20px;
    font-weight: bold;
    margin: 4px 0 8px;
}

.info {
    line-height: 1.7;
    font-size: 15px;
}

.price {
    font-weight: bold;
    font-size: 17px;
}

.address-box {
    margin-top: 12px;
    background: #f7f7f7;
    border-radius: 10px;
    padding: 12px;
}

/* 住所そのものをGoogleマップへのリンクにする */
.address-link {
    display: block;
    color: #222;
    text-decoration: none;
}

.address-title {
    font-size: 13px;
    color: #666;
    margin-bottom: 5px;
}

.address {
    font-size: 15px;
    font-weight: bold;
    word-break: break-all;
}

.address-link:active .address {
    opacity: 0.5;
}

.route {
    margin-top: 12px;
    padding: 10px 12px;
    background: #eef5ff;
    border-radius: 8px;
    font-size: 14px;
}

.empty {
    text-align: center;
    color: #999;
    padding: 30px 10px;
    font-size: 15px;
}

@media (max-width: 600px) {

    body {
        padding: 12px 8px 35px;
    }

    h1 {
        font-size: 21px;
    }

    .card {
        padding: 14px;
    }

    .course-name {
        font-size: 18px;
    }

    .info {
        font-size: 14px;
    }

    .address {
        font-size: 15px;
    }
}
</style>

</head>

<body>

<div class="container">

    <h1>⛳ 栃木ゴルフ　　</h1>

    <div class="subtitle">
        2026年9月19日(土)〜9月21日(月・祝)
    </div>


    <!-- 9/19 -->
    <div class="card">

        <div class="day-title">
            9/19(土)
        </div>

        <div class="course-name">
            ベルセルバカントリークラブさくらコース
        </div>

        <div class="info">
            <strong>10:04 OUT</strong><br>
            <span class="price">20,050円</span>
            （プレー代・宿泊費込み）
        </div>

        <div class="route">
            🏨 <strong>宿泊：ベルセルバ</strong><br>
            宇都宮駅から約50分<br>
            翌朝ごはん付き
        </div>

        <div class="address-box">

            <a
                class="address-link"
                href="https://www.google.com/maps/search/?api=1&query=栃木県さくら市鹿子畑1408-2"
                target="_blank"
            >

                <div class="address-title">
                    📍 住所
                </div>

                <div class="address">
                    栃木県さくら市鹿子畑1408-2
                </div>

            </a>

        </div>

    </div>


    <!-- 9/20 -->
    <div class="card">

        <div class="day-title">
            9/20(日)
        </div>

        <div class="course-name">
            喜連川カントリー倶楽部
        </div>

        <div class="info">
            <strong>9:45 西コース</strong><br>
            <span class="price">7,990円</span>
        </div>

        <div class="route">
            🚗 ベルセルバから約15分
        </div>

        <div class="address-box">

            <a
                class="address-link"
                href="https://www.google.com/maps/search/?api=1&query=栃木県さくら市穂積533-1"
                target="_blank"
            >

                <div class="address-title">
                    📍 住所
                </div>

                <div class="address">
                    栃木県さくら市穂積533-1
                </div>

            </a>

        </div>

    </div>


    <!-- 9/21 -->
    <div class="card">

        <div class="day-title">
            9/21(月・祝)
        </div>

        <div class="empty">
            予定未定
        </div>

    </div>

</div>

</body>
</html>
